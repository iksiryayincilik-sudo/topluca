name: TOPLUCA PHP checks

on:
  push:
    branches: ["v3-rebuild"]
  pull_request:

jobs:
  php-checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: topluca_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, fileinfo
      - name: PHP syntax lint
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: MySQL schema and seed smoke test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: topluca_test
          DB_USER: root
          DB_PASS: root
        run: php tests/schema_smoke.php
